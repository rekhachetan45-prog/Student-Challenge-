<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Challenge - Fun Games</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#eef2ff,#fff7ed);
 color:#172033;
}

header{
 background:linear-gradient(135deg,#4f46e5,#9333ea);
 color:white;
 text-align:center;
 padding:28px 15px;
 border-radius:0 0 30px 30px;
}

header h1{
 margin:0;
 font-size:32px;
}

header p{
 margin:8px 0 0;
}

.container{
 max-width:900px;
 margin:auto;
 padding:16px;
}

.lang{
 text-align:right;
 margin-bottom:10px;
}

button{
 border:0;
 padding:12px 16px;
 border-radius:12px;
 background:#4f46e5;
 color:white;
 font-weight:bold;
 cursor:pointer;
 margin:5px;
}

button:hover{
 opacity:.9;
}

.lang button{
 background:white;
 color:#333;
 border:1px solid #ddd;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin:15px 0;
}

.stat{
 background:white;
 padding:14px 5px;
 text-align:center;
 border-radius:15px;
 box-shadow:0 5px 18px #0001;
 font-weight:bold;
}

.stat span{
 display:block;
 font-size:20px;
 color:#4f46e5;
 margin-top:5px;
}

.card{
 background:white;
 padding:20px;
 margin:15px 0;
 border-radius:22px;
 box-shadow:0 7px 22px #0001;
}

h2{
 margin-top:0;
 color:#4f46e5;
}

.game-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}

.game-btn{
 padding:18px;
 background:#f5f3ff;
 color:#312e81;
 border:2px solid #ddd6fe;
 width:100%;
}

.game-btn strong{
 display:block;
 font-size:18px;
 margin-bottom:5px;
}

.option{
 display:block;
 width:100%;
 text-align:left;
 background:#f8fafc;
 color:#172033;
 border:1px solid #ddd;
 margin:8px 0;
}

input{
 padding:12px;
 border:1px solid #ccc;
 border-radius:10px;
 font-size:16px;
 max-width:100%;
}

.result{
 margin-top:12px;
 padding:12px;
 border-radius:12px;
 background:#f1f5f9;
 font-weight:bold;
}

@media(max-width:600px){
 .stats{
  grid-template-columns:repeat(2,1fr);
 }

 .game-grid{
  grid-template-columns:1fr;
 }

 header h1{
  font-size:26px;
 }
}
</style>
</head>

<body>

<header>
<h1>🎓 <span id="title">Student Challenge</span></h1>
<p id="subtitle">Fun Games • Learn • Challenge Yourself</p>
</header>

<div class="container">

<div class="lang">
<button onclick="setLang('hi')">🇮🇳 हिंदी</button>
<button onclick="setLang('en')">🇬🇧 English</button>
</div>

<div class="stats">

<div class="stat">
<span id="scoreLabel">Score</span>
<strong id="score">0</strong>
</div>

<div class="stat">
<span id="streakLabel">Streak</span>
<strong id="streak">0</strong>
</div>

<div class="stat">
<span id="livesLabel">Lives</span>
<strong id="lives">❤️❤️❤️</strong>
</div>

<div class="stat">
<span id="levelLabel">Level</span>
<strong id="level">1</strong>
</div>

</div>

<div class="card">

<h2 id="gamesTitle">🎮 Games</h2>

<div class="game-grid">

<button class="game-btn" onclick="showGame('quiz')">
<strong id="quizName">🧠 Quiz Battle</strong>
<span id="quizDesc">Test your knowledge</span>
</button>

<button class="game-btn" onclick="showGame('math')">
<strong id="mathName">➗ Math Rush</strong>
<span id="mathDesc">Solve quickly</span>
</button>

<button class="game-btn" onclick="showGame('memory')">
<strong id="memoryName">🧩 Memory Master</strong>
<span id="memoryDesc">Remember the number</span>
</button>

<button class="game-btn" onclick="showGame('word')">
<strong id="wordName">🔤 Word Scramble</strong>
<span id="wordDesc">Make the correct word</span>
</button>

<button class="game-btn" onclick="showGame('guess')">
<strong id="guessName">🎯 Number Guess</strong>
<span id="guessDesc">Guess the number</span>
</button>

<button class="game-btn" onclick="showGame('speed')">
<strong id="speedName">⚡ Speed Challenge</strong>
<span id="speedDesc">Test your speed</span>
</button>

</div>
</div>

<div class="card" id="gameArea">
<h2>🎮 Choose a game</h2>
<p>Select any game above and start playing!</p>
</div>

</div>

<script>

let lang=localStorage.getItem("scLang")||"en";

let score=Number(localStorage.getItem("scScore"))||0;
let streak=Number(localStorage.getItem("scStreak"))||0;
let lives=Number(localStorage.getItem("scLives"));

if(!lives) lives=3;

const text={

en:{
title:"Student Challenge",
subtitle:"Fun Games • Learn • Challenge Yourself",
score:"Score",
streak:"Streak",
lives:"Lives",
level:"Level",
games:"🎮 Games",

quiz:"🧠 Quiz Battle",
quizDesc:"Test your knowledge",

math:"➗ Math Rush",
mathDesc:"Solve quickly",

memory:"🧩 Memory Master",
memoryDesc:"Remember the number",

word:"🔤 Word Scramble",
wordDesc:"Make the correct word",

guess:"🎯 Number Guess",
guessDesc:"Guess the number",

speed:"⚡ Speed Challenge",
speedDesc:"Test your speed",

choose:"🎮 Choose a game",
chooseText:"Select any game above and start playing!"
},

hi:{
title:"Student Challenge",
subtitle:"मज़ेदार गेम • सीखें • खुद को चुनौती दें",
score:"स्कोर",
streak:"लगातार जीत",
lives:"जान",
level:"लेवल",
games:"🎮 गेम्स",

quiz:"🧠 क्विज़ बैटल",
quizDesc:"अपनी जानकारी परखें",

math:"➗ मैथ रश",
mathDesc:"जल्दी से हल करें",

memory:"🧩 मेमोरी मास्टर",
memoryDesc:"नंबर याद रखें",

word:"🔤 वर्ड स्क्रैम्बल",
wordDesc:"सही शब्द बनाएं",

guess:"🎯 नंबर गेस",
guessDesc:"नंबर का अनुमान लगाएं",

speed:"⚡ स्पीड चैलेंज",
speedDesc:"अपनी स्पीड परखें",

choose:"🎮 गेम चुनें",
chooseText:"ऊपर से कोई भी गेम चुनें और खेलना शुरू करें!"
}

};

function setLang(l){

 lang=l;

 localStorage.setItem("scLang",l);

 updateLanguage();

 document.getElementById("gameArea").innerHTML=
 "<h2>"+text[lang].choose+"</h2>"+
 "<p>"+text[lang].chooseText+"</p>";

}

function updateLanguage(){

 let t=text[lang];

 document.getElementById("title").textContent=t.title;
 document.getElementById("subtitle").textContent=t.subtitle;

 document.getElementById("scoreLabel").textContent=t.score;
 document.getElementById("streakLabel").textContent=t.streak;
 document.getElementById("livesLabel").textContent=t.lives;
 document.getElementById("levelLabel").textContent=t.level;

 document.getElementById("gamesTitle").textContent=t.games;

 document.getElementById("quizName").textContent=t.quiz;
 document.getElementById("quizDesc").textContent=t.quizDesc;

 document.getElementById("mathName").textContent=t.math;
 document.getElementById("mathDesc").textContent=t.mathDesc;

 document.getElementById("memoryName").textContent=t.memory;
 document.getElementById("memoryDesc").textContent=t.memoryDesc;

 document.getElementById("wordName").textContent=t.word;
 document.getElementById("wordDesc").textContent=t.wordDesc;

 document.getElementById("guessName").textContent=t.guess;
 document.getElementById("guessDesc").textContent=t.guessDesc;

 document.getElementById("speedName").textContent=t.speed;
 document.getElementById("speedDesc").textContent=t.speedDesc;
}

function save(){

 localStorage.setItem("scScore",score);
 localStorage.setItem("scStreak",streak);
 localStorage.setItem("scLives",lives);

 document.getElementById("score").textContent=score;
 document.getElementById("streak").textContent=streak;

 document.getElementById("lives").textContent=
 "❤️".repeat(Math.max(0,lives));

 document.getElementById("level").textContent=
 Math.floor(score/100)+1;
}

function points(n=10){

 score+=n;
 streak++;
 save();

}

function wrong(){

 streak=0;
 lives=Math.max(0,lives-1);
 save();

}

function showGame(game){

 if(game==="quiz") loadQuiz();

 if(game==="math") newMath();

 if(game==="memory") startMemory();

 if(game==="word") newWord();

 if(game==="guess") newGuess();

 if(game==="speed") startSpeed();

}


/* =========================
QUIZ BATTLE
========================= */

const quizzes={

en:[

{
q:"What is the capital of India?",
o:["Delhi","Mumbai","Jaipur","Kolkata"],
a:0
},

{
q:"How many days are there in a week?",
o:["5","6","7","8"],
a:2
},

{
q:"Which planet is known as the Red Planet?",
o:["Earth","Mars","Jupiter","Venus"],
a:1
},

{
q:"What is 10 + 5?",
o:["12","15","20","25"],
a:1
},

{
q:"Which animal is called the King of the Jungle?",
o:["Tiger","Lion","Elephant","Bear"],
a:1
}

],

hi:[

{
q:"भारत की राजधानी क्या है?",
o:["दिल्ली","मुंबई","जयपुर","कोलकाता"],
a:0
},

{
q:"एक सप्ताह में कितने दिन होते हैं?",
o:["5","6","7","8"],
a:2
},

{
q:"लाल ग्रह किसे कहा जाता है?",
o:["पृथ्वी","मंगल","बृहस्पति","शुक्र"],
a:1
},

{
q:"10 + 5 कितना होता है?",
o:["12","15","20","25"],
a:1
},

{
q:"जंगल का राजा किसे कहा जाता है?",
o:["बाघ","शेर","हाथी","भालू"],
a:1
}

]

};

let quizIndex=0;

function loadQuiz(){

 quizIndex=
 Math.floor(Math.random()*quizzes[lang].length);

 const q=quizzes[lang][quizIndex];

 document.getElementById("gameArea").innerHTML=`

 <h2>${lang==="hi"?"🧠 क्विज़ बैटल":"🧠 Quiz Battle"}</h2>

 <h3>${q.q}</h3>

 <div id="quizOptions"></div>

 `;

 q.o.forEach((option,i)=>{

  const btn=document.createElement("button");

  btn.className="option";

  btn.textContent=option;

  btn.onclick=()=>answerQuiz(i);

  document
  .getElementById("quizOptions")
  .appendChild(btn);

 });

}

function answerQuiz(i){

 const q=quizzes[lang][quizIndex];

 if(i===q.a){

  points(10);

  document.getElementById("gameArea").innerHTML+=`

  <div class="result">
  🎉 ${lang==="hi"?"सही जवाब! +10 अंक":"Correct! +10 points"}
  </div>

  <button onclick="loadQuiz()">
  ${lang==="hi"?"अगला सवाल":"Next Question"}
  </button>

  `;

 }else{

  wrong();

  document.getElementById("gameArea").innerHTML+=`

  <div class="result">
  ❌ ${lang==="hi"?"गलत जवाब!":"Wrong answer!"}
  </div>

  <button onclick="loadQuiz()">
  ${lang==="hi"?"फिर खेलें":"Try Again"}
  </button>

  `;

 }

}


/* =========================
MATH RUSH
========================= */

let mathAnswer=0;

function newMath(){

 const a=Math.floor(Math.random()*20)+1;
 const b=Math.floor(Math.random()*20)+1;

 const operations=["+","-","×"];

 const op=
 operations[Math.floor(Math.random()*operations.length)];

 if(op==="+") mathAnswer=a+b;

 if(op==="-") mathAnswer=a-b;

 if(op==="×") mathAnswer=a*b;

 document.getElementById("gameArea").innerHTML=`

 <h2>
 ${lang==="hi"?"➗ मैथ रश":"➗ Math Rush"}
 </h2>

 <h3>${a} ${op} ${b} = ?</h3>

 <input
 id="mathInput"
 type="number"
 placeholder="${lang==="hi"?"उत्तर लिखें":"Enter answer"}"
 >

 <br>

 <button onclick="checkMath()">
 ${lang==="hi"?"जमा करें":"Submit"}
 </button>

 <div id="mathResult"></div>

 `;

}

function checkMath(){

 const value=
 Number(document.getElementById("mathInput").value);

 if(value===mathAnswer){

  points(10);

  document.getElementById("mathResult").innerHTML=`

  <div class="result">
  🎉 ${lang==="hi"?"सही! +10 अंक":"Correct! +10 points"}
  </div>

  <button onclick="newMath()">
  ${lang==="hi"?"अगला सवाल":"Next Question"}
  </button>

  `;

 }else{

  wrong();

  document.getElementById("mathResult").innerHTML=`

  <div class="result">
  ❌ ${lang==="hi"?"गलत उत्तर":"Wrong answer"}
  </div>

  <button onclick="newMath()">
  ${lang==="hi"?"फिर खेलें":"Try Again"}
  </button>

  `;

 }

}


/* =========================
MEMORY MASTER
========================= */

let memoryNumber="";

function startMemory(){

 memoryNumber=
 Math.floor(10000+Math.random()*90000).toString();

 document.getElementById("gameArea").innerHTML=`

 <h2>
 ${lang==="hi"?"🧩 मेमोरी मास्टर":"🧩 Memory Master"}
 </h2>

 <p>
 ${lang==="hi"
 ?"इस नंबर को याद करें:"
 :"Remember this number:"}
 </p>

 <h1>${memoryNumber}</h1>

 <button onclick="hideMemory()">
 ${lang==="hi"?"नंबर छुपाएं":"Hide Number"}
 </button>

 `;

}

function hideMemory(){

 document.getElementById("gameArea").innerHTML=`

 <h2>
 ${lang==="hi"?"🧩 मेमोरी मास्टर":"🧩 Memory Master"}
 </h2>

 <p>
 ${lang==="hi"
 ?"आपको कौन सा नंबर याद है?"
 :"What number do you remember?"}
 </p>

 <input
 id="memoryInput"
 type="number"
 placeholder="${lang==="hi"?"नंबर लिखें":"Enter number"}"
 >

 <br>

 <button onclick="checkMemory()">
 ${lang==="hi"?"जमा करें":"Submit"}
 </button>

 <div id="memoryResult"></div>

 `;

}

function checkMemory(){

 const value=
 document.getElementById("memoryInput").value;

 if(value===memoryNumber){

  points(15);

  document.getElementById("memoryResult").innerHTML=`

  <div class="result">
  🎉 ${lang==="hi"
  ?"बहुत बढ़िया! +15 अंक"
  :"Excellent! +15 points"}
  </div>

  <button onclick="startMemory()">
  ${lang==="hi"?"फिर खेलें":"Play Again"}
  </button>

  `;

 }else{

  wrong();

  document.getElementById("memoryResult").innerHTML=`

  <div class="result">
  ❌ ${lang==="hi"?"गलत नंबर!":"Wrong number!"}
  </div>

  <button onclick="startMemory()">
  ${lang==="hi"?"फिर खेलें":"Try Again"}
  </button>

  `;

 }

}


/* =========================
WORD SCRAMBLE
========================= */

const words={

en:[
"APPLE",
"HOUSE",
"WATER",
"SCHOOL",
"COMPUTER",
"FRIEND"
],

hi:[
"कमल",
"किताब",
"पानी",
"स्कूल",
"भारत",
"दोस्त"
]

};

let correctWord="";

function newWord(){

 correctWord=
 words[lang][
 Math.floor(Math.random()*words[lang].length)
 ];

 let scrambled=
 [...correctWord]
 .sort(()=>Math.random()-0.5)
 .join("");

 document.getElementById("gameArea").innerHTML=`

 <h2>
 ${lang==="hi"?"🔤 वर्ड स्क्रैम्बल":"🔤 Word Scramble"}
 </h2>

 <p>
 ${lang==="hi"
 ?"इन अक्षरों से सही शब्द बनाएं:"
 :"Make the correct word from these letters:"}
 </p>

 <h1>${scrambled}</h1>

 <input
 id="wordInput"
 placeholder="${lang==="hi"?"सही शब्द लिखें":"Enter word"}"
 >

 <br>

 <button onclick="checkWord()">
 ${lang==="hi"?"जमा करें":"Submit"}
 </button>

 <div id="wordResult"></div>

 `;

}

function checkWord(){

 const value=
 document.getElementById("wordInput")
 .value.trim();

 if(value.toUpperCase()===
 correctWord.toUpperCase()){

  points(15);

  document.getElementById("wordResult").innerHTML=`

  <div class="result">
  🎉 ${lang==="hi"
  ?"सही शब्द! +15 अंक"
  :"Correct word! +15 points"}
  </div>

  <button onclick="newWord()">
  ${lang==="hi"?"अगला शब्द":"Next Word"}
  </button>

  `;

 }else{

  wrong();

  document.getElementById("wordResult").innerHTML=`

  <div class="result">
  ❌ ${lang==="hi"?"गलत शब्द!":"Wrong word!"}
  </div>

  <button onclick="newWord()">
  ${lang==="hi"?"फिर खेलें":"Try Again"}
  </button>

  `;

 }

}


/* =========================
NUMBER GUESS
========================= */

let guessNumber=0;

function newGuess(){

 guessNumber=
 Math.floor(Math.random()*50)+1;

 document.getElementById("gameArea").innerHTML=`

 <h2>
 ${lang==="hi"?"🎯 नंबर गेस":"🎯 Number Guess"}
 </h2>

 <p>
 ${lang==="hi"
 ?"1 से 50 के बीच नंबर का अनुमान लगाएं।"
 :"Guess a number between 1 and 50."}
 </p>

 <input
 id="guessInput"
 type="number"
 min="1"
 max="50"
 >

 <br>

 <button onclick="checkGuess()">
 ${lang==="hi"?"अनुमान लगाएं":"Guess"}
 </button>

 <div id="guessResult"></div>

 `;

}

function checkGuess(){

 const value=
 Number(document.getElementById("guessInput").value);

 if(value===guessNumber){

  points(20);

  document.getElementById("guessResult").innerHTML=`

  <div class="result">
  🎉 ${lang==="hi"
  ?"सही नंबर! +20 अंक"
  :"Correct number! +20 points"}
  </div>

  <button onclick="newGuess()">
  ${lang==="hi"?"फिर खेलें":"Play Again"}
  </button>

  `;

 }else if(value<guessNumber){

  document.getElementById("guessResult").innerHTML=`

  <div class="result">
  ⬆️ ${lang==="hi"
  ?"थोड़ा बड़ा नंबर है"
  :"Try a higher number"}
  </div>

  `;

 }else{

  document.getElementById("guessResult").innerHTML=`

  <div class="result">
  ⬇️ ${lang==="hi"
  ?"थोड़ा छोटा नंबर है"
  :"Try a lower number"}
  </div>

  `;

 }

}


/* =========================
SPEED CHALLENGE
========================= */

let speedCount=0;
let speedStart=0;
let speedRunning=false;

function startSpeed(){

 speedCount=0;
 speedRunning=true;
 speedStart=Date.now();

 document.getElementById("gameArea").innerHTML=`

 <h2>
 ${lang==="hi"
 ?"⚡ स्पीड चैलेंज"
 :"⚡ Speed Challenge"}
 </h2>

 <p>
 ${lang==="hi"
 ?"नीचे वाला बटन 10 बार जितनी जल्दी हो सके दबाएं!"
 :"Tap the button 10 times as fast as you can!"}
 </p>

 <h1 id="tapCount">0 / 10</h1>

 <button
 onclick="tapSpeed()"
 style="font-size:22px;padding:20px 30px"
 >
 ⚡ ${lang==="hi"?"टैप करें":"TAP"}
 </button>

 `;

}

function tapSpeed(){

 if(!speedRunning)return;

 speedCount++;

 document.getElementById("tapCount")
 .textContent=speedCount+" / 10";

 if(speedCount>=10){
  finishSpeed();
 }

}

function finishSpeed(){

 if(!speedRunning)return;

 speedRunning=false;

 const time=
 ((Date.now()-speedStart)/1000).toFixed(2);

 points(20);

 document.getElementById("gameArea").innerHTML=`

 <h2>
 ${lang==="hi"
 ?"🏆 चैलेंज पूरा!"
 :"🏆 Challenge Complete!"}
 </h2>

 <h1>
 ${time}
 ${lang==="hi"?"सेकंड":"seconds"}
 </h1>

 <div class="result">
 🎉 ${lang==="hi"
 ?"बहुत बढ़िया! +20 अंक"
 :"Great job! +20 points"}
 </div>

 <button onclick="startSpeed()">
 ${lang==="hi"?"फिर खेलें":"Play Again"}
 </button>

 `;

}


/* START */

updateLanguage();
save();
loadQuiz();

</script>

</body>
</html>
